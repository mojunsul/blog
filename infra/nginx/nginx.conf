user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time rid=$request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 글 본문(content 최대 100,000자)은 JSON으로 약 600KB라 기본값 1m에 여유를 둔다
    client_max_body_size 2m;

    # 컨테이너가 다시 만들어져 IP가 바뀌어도 따라가도록 업스트림 이름을 요청 때 확인한다
    resolver 127.0.0.11 valid=10s;

    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # 기본값 503은 서버 장애와 구분되지 않는다
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
