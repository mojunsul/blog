server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog/privkey.pem;

    # 변수로 써야 nginx 기동 때가 아니라 요청 때 이름을 확인한다
    set $backend backend:8080;
    set $frontend frontend:3000;

    # location에서 하나라도 쓰면 여기 값을 물려받지 않으므로 location에는 두지 않는다
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Powered-By;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # includeSubDomains·preload는 하위 도메인을 쓰지 않고 preload는 등록 뒤 빼기 어려워 두지 않는다
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$backend;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$backend;
    }

    location / {
        # 버퍼링하면 Next의 Suspense 스트리밍이 끝날 때까지 묶여 나간다
        proxy_buffering off;
        proxy_pass http://$frontend;
    }
}
