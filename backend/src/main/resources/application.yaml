spring:
  application:
    name: blog
  profiles:
    default: local   # 운영은 SPRING_PROFILES_ACTIVE=prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

blog:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    required: false   # 운영은 application-prod.yaml에서 true
  auth:
    jwt-secret: ${JWT_SECRET:}
    jwt-secret-required: false   # 운영은 application-prod.yaml에서 true
    secure-cookie: true          # 로컬(http)은 application-local.yaml에서 false

server:
  forward-headers-strategy: framework

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
