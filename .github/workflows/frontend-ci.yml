name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps 등 라우트 타입은 .next/types에 생성된다 (깨끗한 체크아웃에는 없음).
      - run: npx next typegen
      - run: npx tsc --noEmit
      # 백엔드 없이 빌드가 성공해야 한다 (설계 문서 11장).
      - run: npm run build
